<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>چارت روزانه و ۱ ساعته</title>
<style>
:root{--bg:#0e1318;--p:#161d25;--b:#27313d;--t:#e8edf2;--m:#8996a3;--a:#ffb020}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,Tahoma,sans-serif}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--p);border-bottom:1px solid var(--b)}
input,select,button{background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:6px;padding:8px 10px;font:inherit}
button{cursor:pointer}
button.on{border-color:var(--a);color:var(--a)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--a)}
#key{flex:1 1 150px;direction:ltr}
#sym{width:100px;direction:ltr}
#info{padding:6px 10px;color:var(--m);min-height:30px}
#info b{color:var(--a);font-weight:600}
.panel{position:relative;margin:8px;border:1px solid var(--b);border-radius:8px;overflow:hidden;background:var(--p)}
.tag{position:absolute;top:6px;left:8px;z-index:3;color:var(--m);font-weight:700;pointer-events:none}
.chart{height:38vh;min-height:250px;direction:ltr}
.ov{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.vh{position:absolute;top:0;bottom:0;width:30px;margin-left:-15px;pointer-events:auto;touch-action:none;cursor:ew-resize}
.vl{position:absolute;left:14px;top:0;bottom:0;border-left:2px dashed var(--c,var(--a))}
.x{position:absolute;left:4px;top:26px;width:22px;height:22px;border-radius:50%;background:var(--c,var(--a));color:#111;text-align:center;line-height:21px;font-weight:700;cursor:pointer}
.sh{position:absolute;top:0;bottom:0}
.sh span{position:absolute;top:4px;left:50%;transform:translateX(-50%);color:#fff;font-size:11px;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:4px;white-space:nowrap}
</style>
</head>
<body>
<div class="bar">
  <input id="key" placeholder="Twelve Data API key" autocomplete="off">
  <input id="sym" value="EUR/USD" aria-label="جفت‌ارز">
  <button id="go">بارگذاری</button>
  <select id="every" aria-label="آپدیت خودکار">
    <option value="0">آپدیت دستی</option>
    <option value="60">هر ۱ دقیقه</option>
    <option value="180">هر ۳ دقیقه</option>
    <option value="300" selected>هر ۵ دقیقه</option>
  </select>
  <button id="bDay" class="on">انتخاب کندل</button>
  <button id="bVl">خط عمودی</button>
  <button id="bLine">خط افقی</button>
  <button id="bMag">مگنت</button>
  <button id="bXh" class="on">کراس موازی</button>
  <button id="bSync">همگام زمان</button>
  <button id="bFit">H1 روی بازه</button>
  <button id="bClr">پاک‌سازی</button>
</div>
<div id="st" style="padding:8px 10px 0;color:var(--a);font-weight:600"></div>
<div id="info">کلید API را وارد کن و بارگذاری بزن.</div>
<div class="panel"><span class="tag">D1</span><div id="cd" class="chart"></div><div id="od" class="ov"></div></div>
<div class="panel"><span class="tag">H1</span><div id="ch" class="chart"></div><div id="oh" class="ov"></div></div>

<script>
(function(){
  var U=['https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js',
         'https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js',
         'https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.3/lightweight-charts.standalone.production.js'];
  var tried=[];
  function t(i){
    if(i>=U.length){document.getElementById('st').textContent='خطا: کتابخانه چارت از هیچ‌کدام از سه منبع لود نشد. آدرس‌های امتحان‌شده: '+tried.join(' | ');return;}
    var e=document.createElement('script');e.src=U[i];
    e.onload=function(){if(typeof LightweightCharts==='undefined'){tried.push(U[i].split('/')[2]);t(i+1);}else main();};
    e.onerror=function(){tried.push(U[i].split('/')[2]);t(i+1);};
    document.head.appendChild(e);
  }
  t(0);
})();
function main(){
const $=id=>document.getElementById(id);
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
$('key').value=LS.get('td_key')||'';
$('sym').value=LS.get('td_sym')||'EUR/USD';
const HINT='روی یک کندل روزانه بزن تا کل اون کندل (از شروعش تا شروع کندل بعدی) روی H1 هم هایلایت بشه. برای چند روز پشت‌سرهم، کندل آخر رو هم بزن. برای خط دلخواه، حالت «خط عمودی» رو بزن.';
const HINT_OLD='هر جای چارت (روزانه یا ساعتی) بزن تا خط عمودی بیفته. خط رو بکش تا جابه‌جا شه و با × پاکش کن. هر دو خط پشت‌سرهم یک بازه می‌سازن.';
$('info').textContent=HINT;

const DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const p2=n=>String(n).padStart(2,'0');
const fDay=t=>{const d=new Date(t*1000);return DN[d.getUTCDay()]+' '+d.getUTCDate()+' '+MN[d.getUTCMonth()]+' '+String(d.getUTCFullYear()).slice(2);};
const fDT=t=>{const d=new Date(t*1000);return fDay(t)+' '+p2(d.getUTCHours())+':'+p2(d.getUTCMinutes());};
const tickF=(t,type)=>{const d=new Date(t*1000);
  if(type===0)return String(d.getUTCFullYear());
  if(type===1)return MN[d.getUTCMonth()]+' '+String(d.getUTCFullYear()).slice(2);
  if(type===2)return DN[d.getUTCDay()].slice(0,3)+' '+d.getUTCDate()+' '+MN[d.getUTCMonth()];
  return p2(d.getUTCHours())+':'+p2(d.getUTCMinutes());};
const opt={autoSize:true,crosshair:{mode:0},layout:{background:{color:'#161d25'},textColor:'#8996a3'},
  grid:{vertLines:{color:'#202a35'},horzLines:{color:'#202a35'}},
  rightPriceScale:{borderColor:'#27313d'},
  timeScale:{borderColor:'#27313d',timeVisible:true,secondsVisible:false}};
function mk(el,ov,sec,cf){
  const c=LightweightCharts.createChart(el,Object.assign({},opt,{localization:{timeFormatter:cf},timeScale:Object.assign({},opt.timeScale,{tickMarkFormatter:tickF})}));
  const s=c.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350'});
  const sl=document.createElement('div'); ov.appendChild(sl);
  return {c,s,sec,el,ov,sl,els:new Map(),data:[],lock:0,key:'',pk:null,pt:0,xl:0};
}
const D=mk($('cd'),$('od'),86400,fDay), H=mk($('ch'),$('oh'),3600,fDT);
let lastId=0, dayPair=null, xh=true, vl=[], nid=0, drag=null, mode='day', snap=false, first=true, timer=null, lines=[];
const lb=(a,t)=>{let l=0,h=a.length;while(l<h){const m=(l+h)>>1;a[m].time<t?l=m+1:h=m}return l};
const PAL=['255,176,32','79,195,247','186,104,200','129,199,132'];
const sorted=()=>vl.slice().sort((a,b)=>a.t-b.t);

async function load(iv,n){
  const u='https://api.twelvedata.com/time_series?symbol='+encodeURIComponent($('sym').value.trim())+
    '&interval='+iv+'&outputsize='+n+'&timezone=UTC&apikey='+encodeURIComponent($('key').value.trim());
  const j=await (await fetch(u)).json();
  if(j.status==='error'||!j.values) throw new Error(j.message||'پاسخ نامعتبر');
  return j.values.map(v=>{
    const s=v.datetime.length>10?v.datetime.replace(' ','T'):v.datetime+'T00:00:00';
    return {time:Date.parse(s+'Z')/1000,open:+v.open,high:+v.high,low:+v.low,close:+v.close};
  }).reverse();
}

async function refresh(){
  $('st').style.color='var(--a)';$('st').textContent='در حال دریافت...';
  try{
    const [d,h]=await Promise.all([load('1day',500),load('1h',5000)]);
    D.data=d; H.data=h; D.pk=H.pk=null; D.pt=H.pt=0; paint(D); paint(H);
    if(first){
      D.c.timeScale().setVisibleLogicalRange({from:d.length-40,to:d.length+3});
      H.c.timeScale().setVisibleLogicalRange({from:h.length-120,to:h.length+5});
      first=false;
    }
    $('st').style.color='var(--m)';$('st').textContent='آخرین آپدیت: '+new Date().toLocaleTimeString('fa-IR');
    draw(); info();
  }catch(e){ $('st').textContent='خطا: '+(e.message==='Failed to fetch'?'اتصال به api.twelvedata.com برقرار نشد (اینترنت، فیلتر یا VPN).':e.message); }
}

// time <-> x on a chart (interpolated inside candles)
function xOf(X,t){
  const a=X.data; if(!a.length) return null;
  const j=lb(a,t+1)-1;
  if(j<0) return null;
  const last=j===a.length-1, stale=Date.now()/1000-a[j].time>2*X.sec;
  const f=Math.min((t-a[j].time)/X.sec,(last&&!stale)?48:1); // live: allow future; closed market: stick to last candle edge
  return X.c.timeScale().logicalToCoordinate(j-0.5+f);
}
function xToTime(X,x){
  const a=X.data; if(!a.length) return null;
  const lg=X.c.timeScale().coordinateToLogical(x); if(lg===null) return null;
  const j=Math.max(0,Math.min(a.length-1,Math.floor(lg+0.5)));
  let f=Math.max(0,Math.min(1,lg-(j-0.5)));
  if(snap) f=f<0.5?0:1;
  return Math.round(a[j].time+f*X.sec);
}

function mkHandle(X,id){
  const el=document.createElement('div'); el.className='vh';
  el.innerHTML='<div class="vl"></div><div class="x" data-x="1">×</div>';
  el.addEventListener('pointerdown',e=>{
    if(e.target.dataset.x){vl=vl.filter(o=>o.id!==id);draw();info();return;}
    el.setPointerCapture(e.pointerId); drag={id,X}; lastId=id; e.preventDefault();
  });
  el.addEventListener('pointermove',e=>{
    if(!drag||drag.id!==id) return;
    const t=xToTime(X,e.clientX-X.el.getBoundingClientRect().left); if(t===null) return;
    const o=vl.find(o=>o.id===id); if(o){o.t=t;draw();info();}
  });
  const end=()=>{if(drag&&drag.id===id){drag=null;if(X===D)fitFor(id);}};
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
  return el;
}
function drawOne(X){
  const xs=new Map(); vl.forEach(o=>xs.set(o.id,xOf(X,o.t)));
  const k=vl.map(o=>o.id+':'+o.t+':'+xs.get(o.id)).join();
  if(k===X.key) return; X.key=k;
  const s=sorted(); let sh=''; const col=new Map();
  s.forEach((o,i)=>col.set(o.id,PAL[Math.floor(i/2)%PAL.length]));
  for(let k=0;k+1<s.length;k+=2){
    const x1=xs.get(s[k].id), x2=xs.get(s[k+1].id);
    if(x1!==null&&x2!==null){
      const n=X===H?lb(H.data,s[k+1].t)-lb(H.data,s[k].t):0;
      sh+='<div class="sh" style="left:'+x1+'px;width:'+Math.max(0,x2-x1)+'px;background:rgba('+col.get(s[k].id)+',.2);border-top:3px solid rgb('+col.get(s[k].id)+')">'+(n?'<span>'+n+' H1</span>':'')+'</div>';
    }
  }
  X.sl.innerHTML=sh;
  X.els.forEach((el,id)=>{if(!vl.some(o=>o.id===id)){el.remove();X.els.delete(id);}});
  vl.forEach(o=>{
    let el=X.els.get(o.id);
    if(!el){el=mkHandle(X,o.id);X.ov.appendChild(el);X.els.set(o.id,el);}
    el.style.setProperty('--c','rgb('+col.get(o.id)+')');
    const x=xs.get(o.id);
    el.style.display=x===null?'none':'block';
    if(x!==null) el.style.left=x+'px';
  });
}
function draw(){ drawOne(D); drawOne(H); }
D.c.timeScale().subscribeVisibleLogicalRangeChange(draw);
H.c.timeScale().subscribeVisibleLogicalRangeChange(draw);
new ResizeObserver(draw).observe($('cd')); new ResizeObserver(draw).observe($('ch'));
(function loop(){draw();paint(D);paint(H);requestAnimationFrame(loop);})(); // keeps lines glued to candles while zooming/panning

const fmt=fDT;
function paint(X){ // candles outside the marked ranges are dimmed, inside stay bright (native highlight on both charts)
  const now=performance.now(); if(now-X.pt<150) return;
  const s=sorted(), R=[]; for(let k=0;k+1<s.length;k+=2) R.push([s[k].t,s[k+1].t]);
  const key=R.map(r=>r.join('-')).join(); if(key===X.pk) return;
  X.pk=key; X.pt=now;
  X.s.setData(R.length?X.data.map(b=>{
    if(R.some(r=>b.time>=r[0]&&b.time<r[1])) return b;
    const c=b.close>=b.open?'rgba(38,166,154,.28)':'rgba(239,83,80,.28)';
    return Object.assign({},b,{color:c,wickColor:c,borderColor:c});
  }):X.data);
}
// parallel crosshair: hovering a daily candle shows the crosshair at its start on H1, and vice versa
function mirror(S,T,p){
  if(!xh||performance.now()<S.xl) return;
  try{
    T.xl=performance.now()+60;
    if(!p.time||!p.point){T.c.clearCrosshairPosition();return;}
    const price=S.s.coordinateToPrice(p.point.y); if(price===null) return;
    let t;
    if(S===D){const i=lb(H.data,p.time); if(i>=H.data.length) return; t=H.data[i].time;}
    else{const j=lb(D.data,p.time+1)-1; if(j<0) return; t=D.data[j].time;}
    T.c.setCrosshairPosition(price,t,T.s);
  }catch(e){}
}
D.c.subscribeCrosshairMove(p=>mirror(D,H,p));
H.c.subscribeCrosshairMove(p=>mirror(H,D,p));
function info(){
  const s=sorted(), h=H.data;
  if(!s.length){$('info').textContent=HINT;return;}
  let out=[];
  for(let k=0;k+1<s.length&&out.length<4;k+=2){
    const i=lb(h,s[k].t), j=lb(h,s[k+1].t)-1;
    let line='<b>بازه '+(k/2+1)+':</b> '+fmt(s[k].t)+' تا '+fmt(s[k+1].t);
    if(j<i) line+=' | کندل H1 نیست';
    else{
      let hi=-Infinity, lo=Infinity;
      for(let q=i;q<=j;q++){hi=Math.max(hi,h[q].high);lo=Math.min(lo,h[q].low);}
      const sym=$('sym').value.toUpperCase();
      const pip=sym.includes('JPY')?0.01:sym.includes('XAU')?0.1:0.0001;
      line+=' | '+(j-i+1)+' کندل H1 | بالا '+hi.toFixed(5)+' | پایین '+lo.toFixed(5)+' | رنج '+((hi-lo)/pip).toFixed(1)+' پیپ';
    }
    out.push(line);
  }
  if(s.length%2) out.push('یک خط تنهاست؛ خط بعدی رو بذار تا بازه بسازه. (زمان UTC)');
  else out.push('زمان‌ها UTC هستن.');
  $('info').innerHTML=out.join('<br>');
}
function fitFor(id){
  const s=sorted(), k=s.findIndex(o=>o.id===id); if(k<0) return;
  const a=s[k-(k%2)], b=s[k-(k%2)+1]; if(!b) return;
  const i=lb(H.data,a.t), j=lb(H.data,b.t)-1;
  if(j>=i) H.c.timeScale().setVisibleLogicalRange({from:i-4,to:j+4});
}
function addAt(X,p){
  if(!p.point) return;
  const t=xToTime(X,p.point.x); if(t===null) return;
  const o={id:++nid,t}; lastId=o.id; vl.push(o); draw(); info();
  if(X===D) fitFor(o.id);
}
function addLine(X,p){
  if(!p.point) return;
  const price=X.s.coordinateToPrice(p.point.y); if(price===null) return;
  lines.push({s:X.s,l:X.s.createPriceLine({price,color:'#4fc3f7',lineWidth:1,lineStyle:2,axisLabelVisible:true})});
}
D.c.subscribeClick(p=>{
  if(mode==='line') return addLine(D,p);
  if(mode==='vl') return addAt(D,p);
  if(!p.time) return; // candle mode: lines at the candle's start and at the start of the next one
  const t=p.time;
  if(dayPair&&dayPair.single){
    const A=vl.find(o=>o.id===dayPair.a), B=vl.find(o=>o.id===dayPair.b);
    if(A&&B){A.t=Math.min(A.t,t);B.t=Math.max(B.t,t+86400);dayPair.single=false;lastId=A.id;draw();info();fitFor(A.id);return;}
  }
  const a={id:++nid,t}, b={id:++nid,t:t+86400};
  vl.push(a,b); dayPair={a:a.id,b:b.id,single:true}; lastId=a.id; draw(); info(); fitFor(a.id);
});
H.c.subscribeClick(p=>{
  if(mode==='line') addLine(H,p);
  else if(mode==='vl') addAt(H,p);
});

let sync=false;
function toLg(X,t){const a=X.data;if(!a.length)return 0;const j=lb(a,t+1)-1;
  if(j<0)return -0.5+(t-a[0].time)/X.sec;
  const f=(t-a[j].time)/X.sec; return j-0.5+(j===a.length-1?f:Math.min(f,1));}
function toTime(X,lg){const a=X.data;const j=Math.max(0,Math.min(a.length-1,Math.floor(lg+0.5)));return a[j].time+(lg-(j-0.5))*X.sec;}
function follow(S,T,r){
  if(!r||!S.data.length||!T.data.length||performance.now()<S.lock) return;
  T.lock=performance.now()+250;
  T.c.timeScale().setVisibleLogicalRange({from:toLg(T,toTime(S,r.from)),to:toLg(T,toTime(S,r.to))});
}
D.c.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(sync)follow(D,H,r);});
H.c.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(sync)follow(H,D,r);});
$('bSync').onclick=()=>{sync=!sync;$('bSync').classList.toggle('on',sync);if(sync)follow(D,H,D.c.timeScale().getVisibleLogicalRange());};
$('bFit').onclick=()=>{const s=sorted(); if(s.length) fitFor(lastId||s[0].id);};
function setMode(m){mode=m;
  $('bVl').classList.toggle('on',m==='vl');$('bDay').classList.toggle('on',m==='day');$('bLine').classList.toggle('on',m==='line');}
$('bVl').onclick=()=>setMode('vl');
$('bDay').onclick=()=>setMode('day');
$('bLine').onclick=()=>setMode(mode==='line'?'vl':'line');
$('bXh').onclick=()=>{xh=!xh;$('bXh').classList.toggle('on',xh);if(!xh){try{D.c.clearCrosshairPosition();H.c.clearCrosshairPosition();}catch(e){}}};
$('bMag').onclick=()=>{snap=!snap;$('bMag').classList.toggle('on',snap);};
$('bClr').onclick=()=>{lines.forEach(o=>o.s.removePriceLine(o.l));lines=[];vl=[];dayPair=null;draw();info();};

function startTimer(){
  clearInterval(timer);
  const s=+$('every').value; if(!s) return;
  timer=setInterval(()=>{if(document.visibilityState==='visible'&&$('key').value) refresh();},s*1000);
}
$('every').onchange=startTimer;
$('go').onclick=()=>{
  LS.set('td_key',$('key').value.trim()); LS.set('td_sym',$('sym').value.trim());
  first=true; vl=[]; draw(); refresh(); startTimer();
};
if($('key').value){refresh();startTimer();}
}
</script>
</body>
</html>
